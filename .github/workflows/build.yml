name: build

on:
  push:
    branches: [ "main" ] # Сборка запускается при каждом пуше в ветку main

jobs:
  build:
    runs-on: windows-latest # Запускаем на сервере с Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-cli-app
        path: dist/main.exe
